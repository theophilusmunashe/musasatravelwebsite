name: Build and Deploy to cPanel

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-rebuild]

jobs:
  web-deploy:
    name: Deploy static site to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static HTML for cPanel
        run: npm run build:cpanel
        env:
          NODE_ENV: production
          CPANEL_STATIC: "1"
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          BOOKINGS_EMAIL_TO: ${{ secrets.BOOKINGS_EMAIL_TO }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          ENQUIRIES_EMAIL_TO: ${{ secrets.ENQUIRIES_EMAIL_TO }}

      - name: Confirm static bundle
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/image/favicon.png
          test -d out/_next/static
          test -f out/api/contact/index.php
          test -f out/api/bookings/enquiry/index.php
          echo "Top-level out files:"
          ls -la out | head -40

      - name: Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
