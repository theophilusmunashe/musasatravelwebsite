name: Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          rm -rf deploy
          mkdir -p deploy
          # Copy all standalone output, including hidden .next/ (cp * skips dotfiles)
          rsync -a .next/standalone/ deploy/
          mkdir -p deploy/.next/static
          rsync -a .next/static/ deploy/.next/static/
          rsync -a public/ deploy/public/
          cp ecosystem.config.cjs deploy/

      - name: Deploy to /var/www/kumusha
        run: |
          rsync -a --delete --exclude='.env' deploy/ /var/www/kumusha/

      - name: Restart application
        run: |
          pm2 startOrReload /var/www/kumusha/ecosystem.config.cjs --env production
          pm2 save
