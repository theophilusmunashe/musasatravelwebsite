name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public

      - name: Create compressed build archive
        run: |
          ARCHIVE="kumusha-${{ github.sha }}.tar.gz"
          tar -czf "$ARCHIVE" -C deploy .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE"

      - name: Deploy to /var/www/kumusha
        run: |
          set -euo pipefail
          DEPLOY_DIR="/var/www/kumusha"
          STAGING="/tmp/kumusha-staging-${{ github.sha }}"
          rm -rf "$STAGING"
          mkdir -p "$STAGING" "$DEPLOY_DIR"
          tar -xzf "$ARCHIVE" -C "$STAGING"
          rsync -a --delete --exclude='.env' "$STAGING"/ "$DEPLOY_DIR"/
          rm -rf "$STAGING" "$ARCHIVE"

      - name: Restart application
        run: |
          if [ -n "${DEPLOY_RESTART_COMMAND:-}" ]; then
            eval "$DEPLOY_RESTART_COMMAND"
          fi
